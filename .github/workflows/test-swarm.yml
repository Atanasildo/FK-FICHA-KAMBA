name: Testar recolha Swarm

on:
  workflow_dispatch:
  push:
    branches:
      - feat/analysis-before-odds

permissions:
  contents: read

concurrency:
  group: swarm-network-test
  cancel-in-progress: false

jobs:
  test-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar descoberta e recolha das odds
        run: |
          node --input-type=module <<'NODE'
          import {
            discoverSwarmGames,
            collectSwarm,
            SWARM_BOOKMAKERS
          } from "./lib/bookmakers/swarm.js";

          const providers = ["bantu", "elephant"];
          const discovered = {};

          for (const name of providers) {
            console.log("\\nA testar descoberta: " + name);
            discovered[name] = await discoverSwarmGames({
              ...SWARM_BOOKMAKERS[name],
              sportId: 1,
              timeoutMs: 45000
            });
            console.log(JSON.stringify({
              bookmaker: name,
              gamesFound: discovered[name].gamesFound,
              totalRecords: discovered[name].totalRecords
            }));
          }

          const bantuIds = new Set(discovered.bantu.games.map(g => g.id));
          const common = discovered.elephant.games
            .filter(g => bantuIds.has(g.id))
            .sort((a, b) => (a.start_ts || 0) - (b.start_ts || 0));

          if (!common.length) {
            throw new Error("As duas casas responderam, mas não foi encontrado nenhum jogo em comum.");
          }

          const selected = common[0];
          console.log("\\nJogo comum seleccionado: " + selected.home + " vs " + selected.away + " (" + selected.id + ")");

          for (const name of providers) {
            const result = await collectSwarm({
              ...SWARM_BOOKMAKERS[name],
              gameIds: [selected.id],
              timeoutMs: 45000
            });
            const game = result.games[0];
            const selections = game?.markets?.reduce((sum, market) => sum + market.selections.length, 0) || 0;
            console.log(JSON.stringify({
              bookmaker: name,
              requested: result.requested,
              received: result.received,
              markets: game?.markets?.length || 0,
              selections,
              missing: result.missing
            }));
            if (result.received !== 1 || !game?.markets?.length || !selections) {
              throw new Error("A recolha de odds falhou para " + name + ".");
            }
          }

          console.log("\\nRESULTADO: GitHub Actions conseguiu descobrir jogos e recolher odds nas duas casas.");
          NODE
