openapi: 3.1.0
info:
  title: Ficha Kamba Universal AI API
  version: 0.1.0
  description: REST API para IAs independentes consultarem jogos, guardarem análises e publicarem boletins.
servers:
  - url: https://{host}/api
    variables:
      host:
        default: fk-ficha-kamba.vercel.app
security:
  - BearerAIKey: []
paths:
  /ai-access:
    get:
      summary: Consultar jogos elegíveis
      parameters:
        - in: query
          name: op
          required: true
          schema: { type: string, const: fixtures }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Jogos, odds, estatísticas e análises anteriores }
        '401': { description: Chave inválida ou revogada }
    post:
      summary: Guardar análise, publicar boletins ou consultar publicação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, matchId, analysis]
                  properties:
                    action: { const: submit-analysis }
                    matchId: { type: string, format: uuid }
                    model: { type: string }
                    analysis: { type: object }
                - type: object
                  required: [action, idempotencyKey, pool]
                  properties:
                    action: { const: publish }
                    idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
                    pool: { type: array, minItems: 1, maxItems: 500, items: { type: object } }
                - type: object
                  required: [action, publicationId]
                  properties:
                    action: { const: status }
                    publicationId: { type: string, format: uuid }
      responses:
        '200': { description: Operação concluída ou estado consultado }
        '201': { description: Análise guardada }
        '400': { description: Pedido inválido }
        '401': { description: Chave inválida ou revogada }
        '403': { description: Escopo insuficiente }
        '409': { description: Conflito ou chave de idempotência já utilizada }
components:
  securitySchemes:
    BearerAIKey:
      type: http
      scheme: bearer
      bearerFormat: fkai
